name: Bullion Pulse — Morning Brief Digest

on:
  schedule:
    # Runs weekdays at 13:00 UTC (8:00 AM EST / 9:00 AM EDT)
    - cron: '0 13 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  morning-digest:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Send daily 8:00 AM ET Bullion Pulse Morning Brief
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          MORNING_DIGEST: ${{ vars.MORNING_DIGEST || 'false' }}
          APP_URL: ${{ vars.APP_URL }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" != "workflow_dispatch" ] && [ "$MORNING_DIGEST" != "true" ]; then
            echo "MORNING_DIGEST variable is not set to 'true' — skipping scheduled morning brief."
            exit 0
          fi
          if [ -z "$NTFY_TOPIC" ]; then
            echo "NTFY_TOPIC secret is not configured yet — running dry-run morning brief."
            node monitor/check_metals.mjs --digest --dry-run
          else
            node monitor/check_metals.mjs --digest
          fi
