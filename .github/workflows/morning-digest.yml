name: Bullion Pulse — Morning Brief Digest

on:
  schedule:
    # Runs weekdays at 13:00 UTC (8:00 AM EST / 9:00 AM EDT)
    - cron: '0 13 * * 1-5'
  workflow_dispatch:

permissions: {}

concurrency:
  group: bullion-pulse-morning-digest
  cancel-in-progress: false

jobs:
  morning-digest:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.MORNING_DIGEST == 'true' }}
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Send daily 8:00 AM ET Bullion Pulse Morning Brief
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          MORNING_DIGEST: ${{ vars.MORNING_DIGEST || 'false' }}
          APP_URL: ${{ vars.APP_URL }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ -z "$NTFY_TOPIC" ]; then
            echo "NTFY_TOPIC secret is not configured yet — running dry-run morning brief."
            node monitor/check_metals.mjs --digest --dry-run
          else
            node monitor/check_metals.mjs --digest
          fi
