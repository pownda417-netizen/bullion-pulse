name: Daily Post-Close Self-Learning (5:10 PM ET)

on:
  schedule:
    # 5:15 PM EDT (21:15 UTC) & 5:15 PM EST (22:15 UTC) Mon-Fri (offset from :10 outlook cron to avoid queue collisions).
    # monitor/self_learn.mjs checks America/New_York time (>= 17:05 ET)
    # and enforces strict once-per-NY-trading-day deduplication so it runs
    # exactly ONCE per trading day after market close, year-round.
    - cron: '15 21 * * 1-5'
    - cron: '15 22 * * 1-5'
  workflow_dispatch:

permissions: {}

concurrency:
  group: bullion-pulse-data-commit
  cancel-in-progress: false

jobs:
  self-learn:
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Grade multi-horizon predictions & adapt regime weights (5:10 PM ET)
        run: node monitor/self_learn.mjs

      - name: Re-run outlook with updated self-learned weights
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CATALYST_ALERTS: 'false'
        run: node monitor/analyze_outlook.mjs

      - name: Validate & commit updated learned weights & outlook
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILES=(data/learned_weights.json data/outlook.json data/comex.json data/shanghai.json data/candles.json data/candles_1d.json data/candles_hist.json data/accuracy_log.json)
          for f in "${FILES[@]}"; do
            if [ ! -f "$f" ] || [ -L "$f" ]; then
              echo "Missing or symlinked snapshot file: $f"
              exit 1
            fi
            node -e "JSON.parse(require('node:fs').readFileSync(process.argv[1], 'utf8'))" "$f"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${FILES[@]}"
          if ! git diff --cached --quiet; then
            git commit -m "learn: daily 5:10 PM ET multi-horizon post-close calibration"
            AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
            git -c "http.https://github.com/.extraheader=${AUTH_HEADER}" pull --rebase origin main || { git rebase --abort || true; exit 1; }
            git -c "http.https://github.com/.extraheader=${AUTH_HEADER}" push origin HEAD:main
          else
            echo "No daily learning update required."
          fi
