name: Bullion Pulse — News & Macro Outlook Refresh

on:
  schedule:
    # Refresh news catalysts & historical macro outlook every 30 minutes (24/7)
    - cron: '10,40 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bullion-pulse-data-commit
  cancel-in-progress: false

jobs:
  update-outlook:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch world/metals news & compute probabilistic outlook
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          CATALYST_ALERTS: ${{ vars.CATALYST_ALERTS || 'false' }}
          APP_URL: ${{ vars.APP_URL }}
        run: node monitor/analyze_outlook.mjs

      - name: Commit refreshed outlook, COMEX, Shanghai SGE, split candles & accuracy log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/outlook.json data/shanghai.json data/comex.json data/candles.json data/candles_1d.json data/candles_hist.json data/accuracy_log.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh pro outlook, COMEX, SGE, split candles & accuracy log"
            git pull --rebase --autostash
            git push
          else
            echo "No data changes to commit."
          fi
