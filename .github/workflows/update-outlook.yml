name: Bullion Pulse — News & Macro Outlook Refresh

on:
  schedule:
    # Refresh news catalysts, COMEX, Shanghai SGE & macro outlook every 10 minutes (24/7)
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: bullion-pulse-data-commit
  cancel-in-progress: false

jobs:
  update-outlook:
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Fetch world/metals news & compute probabilistic outlook
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NTFY_TOPIC: ${{ vars.CATALYST_ALERTS == 'true' && secrets.NTFY_TOPIC || '' }}
          NTFY_SERVER: ${{ vars.CATALYST_ALERTS == 'true' && secrets.NTFY_SERVER || '' }}
          NTFY_TOKEN: ${{ vars.CATALYST_ALERTS == 'true' && secrets.NTFY_TOKEN || '' }}
          CATALYST_ALERTS: ${{ vars.CATALYST_ALERTS || 'false' }}
          APP_URL: ${{ vars.APP_URL }}
        run: node monitor/analyze_outlook.mjs

      - name: Validate & commit refreshed outlook, COMEX, Shanghai SGE, split candles & accuracy log
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILES=(data/outlook.json data/shanghai.json data/comex.json data/candles.json data/candles_1d.json data/candles_hist.json data/accuracy_log.json)
          for f in "${FILES[@]}"; do
            if [ ! -f "$f" ] || [ -L "$f" ]; then
              echo "Missing or symlinked snapshot file: $f"
              exit 1
            fi
            node -e "JSON.parse(require('node:fs').readFileSync(process.argv[1], 'utf8'))" "$f"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${FILES[@]}"
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh pro outlook, COMEX, SGE, split candles & accuracy log"
            AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
            git -c "http.https://github.com/.extraheader=${AUTH_HEADER}" pull --rebase origin main || { git rebase --abort || true; exit 1; }
            git -c "http.https://github.com/.extraheader=${AUTH_HEADER}" push origin HEAD:main
          else
            echo "No data changes to commit."
          fi
