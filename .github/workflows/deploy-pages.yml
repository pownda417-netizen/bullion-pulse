name: Deploy Bullion Pulse PWA to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_run:
    workflows:
      - 'Bullion Pulse — News & Macro Outlook Refresh'
      - 'Daily Post-Close Self-Learning (5:10 PM ET)'
    branches: ['main']
    types: [completed]
  workflow_dispatch:

permissions: {}

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Validate and stage static PWA files
        run: |
          mkdir -p _site/icons _site/data
          cp -- index.html styles.css app.js intel.js i18n_packs.js display_i18n.js mc_worker.js tts_worker.js manifest.json sw.js _site/
          cp -- icons/*.png icons/*.jpg _site/icons/
          if [ -d data ]; then
            shopt -s nullglob
            for f in data/*.json; do
              if [ ! -f "$f" ] || [ -L "$f" ]; then
                echo "Invalid or symlinked data file: $f"
                exit 1
              fi
              python3 -m json.tool "$f" >/dev/null
              cp -- "$f" _site/data/
            done
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: '_site'

  deploy:
    timeout-minutes: 10
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
