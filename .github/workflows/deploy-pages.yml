name: Deploy Bullion Pulse PWA to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_run:
    workflows:
      - 'Bullion Pulse — News & Macro Outlook Refresh'
      - 'Daily Post-Close Self-Learning (5:10 PM ET)'
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Refresh live Yahoo candles (1D-ALL), COMEX & SGE data
        run: node monitor/analyze_outlook.mjs || echo "Using committed snapshot data"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Stage static PWA files
        run: |
          mkdir -p _site/icons _site/data
          cp index.html styles.css app.js intel.js i18n_packs.js display_i18n.js mc_worker.js tts_worker.js manifest.json sw.js _site/
          cp icons/*.png icons/*.jpg _site/icons/
          if [ -d data ]; then cp data/*.json _site/data/ 2>/dev/null || true; fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '_site'

  deploy:
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
