name: Deploy Bullion Pulse React PWA to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_run:
    workflows:
      - 'Bullion Pulse — News & Macro Outlook Refresh'
      - 'Daily Post-Close Self-Learning (5:10 PM ET)'
    branches: ['main']
    types: [completed]
  workflow_dispatch:

permissions: {}

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check, test, and build Vite bundle
        run: |
          npm run typecheck
          npm run test:frontend
          npm run build

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Validate and sync latest cron data/*.json into dist/data
        run: |
          mkdir -p dist/data
          if [ -d data ]; then
            shopt -s nullglob
            for f in data/*.json; do
              if [ ! -f "$f" ] || [ -L "$f" ]; then
                echo "Invalid or symlinked data file: $f"
                exit 1
              fi
              python3 -m json.tool "$f" >/dev/null
              cp -- "$f" dist/data/
            done
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: 'dist'

  deploy:
    timeout-minutes: 10
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
