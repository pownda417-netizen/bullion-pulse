name: Bullion Pulse — Metal Move Alerts

on:
  schedule:
    # Runs every 5 minutes Monday–Friday (global spot gold/silver trading hours)
    - cron: '*/5 * * * 1-5'
    # Also check Sunday evening UTC when Asia/COMEX opens
    - cron: '*/15 22-23 * * 0'
  workflow_dispatch:
    inputs:
      send_test:
        description: 'Send a test push notification to your phone right now'
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  group: bullion-pulse-metal-alerts
  cancel-in-progress: false

jobs:
  check-metals:
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Restore daily alert deduplication state
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: monitor/state.json
          key: bullion-alert-state-${{ github.run_id }}
          restore-keys: |
            bullion-alert-state-

      - name: Check spot Gold (XAU), Silver (XAG) & Shanghai SGE Premium
        id: check
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          GOLD_THRESHOLD_PCT: ${{ vars.GOLD_THRESHOLD_PCT || '1.5' }}
          SILVER_THRESHOLD_PCT: ${{ vars.SILVER_THRESHOLD_PCT || '3.0' }}
          SHANGHAI_PREMIUM_THRESHOLD_USD: ${{ vars.SHANGHAI_PREMIUM_THRESHOLD_USD || '35' }}
          GOLD_ABOVE_USD: ${{ vars.GOLD_ABOVE_USD }}
          GOLD_BELOW_USD: ${{ vars.GOLD_BELOW_USD }}
          SILVER_ABOVE_USD: ${{ vars.SILVER_ABOVE_USD }}
          SILVER_BELOW_USD: ${{ vars.SILVER_BELOW_USD }}
          RATIO_ABOVE: ${{ vars.RATIO_ABOVE }}
          RATIO_BELOW: ${{ vars.RATIO_BELOW }}
          ALERT_DIRECTION: ${{ vars.ALERT_DIRECTION || 'both' }}
          ESCALATION_STEP_PCT: ${{ vars.ESCALATION_STEP_PCT || '1.0' }}
          CONFIRM_MOVES: ${{ vars.CONFIRM_MOVES || 'false' }}
          QUIET_HOURS_START: ${{ vars.QUIET_HOURS_START }}
          QUIET_HOURS_END: ${{ vars.QUIET_HOURS_END }}
          ALERT_BACKWARDATION: ${{ vars.ALERT_BACKWARDATION || 'true' }}
          ALERT_SHORT_SQUEEZE: ${{ vars.ALERT_SHORT_SQUEEZE || 'true' }}
          ALERT_DXY_SHOCK: ${{ vars.ALERT_DXY_SHOCK || 'true' }}
          APP_URL: ${{ vars.APP_URL }}
          SEND_TEST: ${{ inputs.send_test }}
        run: |
          BEFORE_HASH=""
          if [ -f monitor/state.json ]; then
            BEFORE_HASH="$(sha256sum monitor/state.json | awk '{print $1}')"
          fi
          if [ -z "$NTFY_TOPIC" ]; then
            echo "NTFY_TOPIC secret is not configured yet — running dry-run check cleanly."
            node monitor/check_metals.mjs --dry-run
          elif [ "$SEND_TEST" = "true" ]; then
            node monitor/check_metals.mjs --test
          else
            node monitor/check_metals.mjs
          fi
          AFTER_HASH=""
          if [ -f monitor/state.json ]; then
            AFTER_HASH="$(sha256sum monitor/state.json | awk '{print $1}')"
          fi
          if [ -n "$AFTER_HASH" ] && [ "$BEFORE_HASH" != "$AFTER_HASH" ]; then
            echo "state_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "state_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Save daily alert deduplication state
        if: ${{ success() && steps.check.outputs.state_changed == 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: monitor/state.json
          key: bullion-alert-state-${{ github.run_id }}
